services:
  postgres:
    image: postgres:17-alpine
    container_name: admin-docs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-admin_docs}
      POSTGRES_USER: ${POSTGRES_USER:-admin_docs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin_docs} -d ${POSTGRES_DB:-admin_docs}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: admin-docs-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://admin_docs:change_me@postgres:5432/admin_docs?schema=public}
      BACKEND_PORT: ${BACKEND_PORT:-3000}
      STORAGE_ROOT: /app/storage
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - ./storage:/app/storage
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: admin-docs-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      - backend

volumes:
  postgres_data:
