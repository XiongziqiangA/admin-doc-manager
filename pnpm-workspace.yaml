packages:
  - "backend"
  - "desktop"
  - "frontend"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  electron: true
  electron-winstaller: true
  prisma: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - "esbuild"
  - "electron"
  - "electron-winstaller"
  - "prisma"

overrides:
  '@fast-csv/parse': "4.3.6"
  '@xmldom/xmldom': "0.8.15"
  app-builder-lib>@electron/get: "5.1.0"
  brace-expansion: "5.0.9"
  deepmerge-ts: "8.0.2"
  js-yaml: "5.2.2"
  lodash: "4.18.1"
  multer: "2.3.0"
  qs: "6.16.0"
  tmp: "0.2.7"
  uuid: "11.1.1"
  fast-csv: "4.3.6"
