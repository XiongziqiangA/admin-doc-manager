packages:
  - "backend"
  - "desktop"
  - "frontend"

allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  esbuild: true
  electron: true
  electron-winstaller: true
  prisma: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - "esbuild"
  - "electron"
  - "electron-winstaller"
  - "prisma"

overrides:
  app-builder-lib>@electron/get: "5.1.0"
  brace-expansion: "5.0.8"
  js-yaml: "5.2.2"
  tmp: "0.2.7"
